<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: zoom stays enabled (WCAG 1.4.4) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081613" />
    <!-- Dark before first paint: the webview paints the canvas from this style
         before the CSS bundle lands, so boot is never a white flash. Keep the
         hex in sync with tokens.css --bg-base. -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/vkick-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html {
        background: #081613;
        color-scheme: dark;
      }
      /* Boot splash: visible from the first paint, removed by React when the
         shell is interactive. Kept here (not in index.css) so it needs zero
         JS and zero app CSS to render. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #081613;
        transition: opacity 250ms ease-out;
      }
      #boot img {
        width: 96px;
        height: 96px;
      }
      html.boot-done #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Vkick</title>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/vkick-mark.svg" alt="" width="96" height="96" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
