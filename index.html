<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: zoom stays enabled (WCAG 1.4.4) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081613" />
    <!-- Dark before first paint: the webview paints the canvas from this style
         before the CSS bundle lands, so boot is never a white flash. Keep the
         hex in sync with tokens.css --bg-base. -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/vkick-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html {
        background: #081613;
        color-scheme: dark;
      }
      /* Boot splash: visible from the first paint, removed by React when the
         shell is interactive. Kept here (not in index.css) so it needs zero
         JS and zero app CSS to render. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #081613;
        transition: opacity 250ms ease-out;
      }
      #boot img {
        width: 96px;
        height: 96px;
      }
      html.boot-done #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <meta
      name="description"
      content="Follow your clubs and check live scores, fixtures and every table — live matchday for every league ESPN covers."
    />
    <!-- Link previews when the app URL is shared. The image path is
         root-relative on purpose: the deployed origin is not known at build
         time (Render, a tunnel and a custom domain all differ) and scrapers
         resolve it against this page — swap in an absolute URL if yours
         insists. 640x360 is Telegram's recommended preview ratio. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vkick — live scores &amp; league tables" />
    <meta
      property="og:description"
      content="Follow your clubs, check live scores and every table."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="360" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Vkick</title>
    <!-- BEGIN Tapsell ad loader -->
    <script type="text/javascript">
      (function () {
        const head = document.getElementsByTagName("head")[0];
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.async = true;
        script.src = "https://s1.mediaad.org/serve/vkick.onrender.com/loader.js";
        head.appendChild(script);
      })();
    </script>
    <!-- END Tapsell ad loader -->
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/vkick-mark.svg" alt="" width="96" height="96" />
    </div>
    <div id="root"></div>
    <!-- Telegram's official SDK: initData must exist when AuthProvider first
         reads it, or the Telegram login silently degrades to a guest account
         (no bot pushes).

         It is loaded WITHOUT blocking the parser and with a hard 1.5s
         deadline. As a synchronous script it stalled boot for 32 seconds on
         any network that cannot reach telegram.org — which includes Iran,
         where this app ships — because the parser waits for a blackholed TCP
         connection to time out before it will even look at the app bundle.
         Either outcome (loaded, failed, deadline) dispatches tg-sdk-settled,
         and main.tsx mounts on that. -->
    <script>
      (function () {
        function settle() {
          if (window.__tgSdkSettled) return;
          window.__tgSdkSettled = true;
          window.dispatchEvent(new Event("tg-sdk-settled"));
        }
        var sdk = document.createElement("script");
        sdk.src = "https://telegram.org/js/telegram-web-app.js";
        sdk.async = true;
        sdk.onload = settle;
        sdk.onerror = settle;
        document.head.appendChild(sdk);
        setTimeout(settle, 1500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
