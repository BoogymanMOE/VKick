<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: zoom stays enabled (WCAG 1.4.4) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081613" />
    <!-- Dark before first paint: the webview paints the canvas from this style
         before the CSS bundle lands, so boot is never a white flash. Keep the
         hex in sync with tokens.css --bg-base. -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/vkick-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html {
        background: #081613;
        color-scheme: dark;
      }
    <!-- Google Fonts fallback: used if fontsource CDN is blocked on Render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      /* Boot splash: sits INSIDE #root (React's first render replaces it).
         Literal brand colours, not tokens — this runs before the CSS bundle.
         The 150ms animation delay keeps fast loads flash-free; reduced motion
         gets a static plate with no spinning ring. */
      #boot {
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #081613;
        opacity: 0;
        animation: bootIn 0.2s ease 0.15s forwards;
      }
      .boot-ring {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #1e3b34;
        border-top-color: #1fbfa0;
        animation: bootSpin 0.8s linear infinite;
      }
      @keyframes bootIn {
        to {
          opacity: 1;
        }
      }
      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring {
          animation: none;
        }
      }
    </style>
    <meta
      name="description"
      content="Follow your clubs and check live scores, fixtures and every table — live matchday for every league ESPN covers."
    />
    <!-- Link previews when the app URL is shared. The image path is
         root-relative on purpose: the deployed origin is not known at build
         time (Render, a tunnel and a custom domain all differ) and scrapers
         resolve it against this page — swap in an absolute URL if yours
         insists. 640x360 is Telegram's recommended preview ratio. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vkick — live scores &amp; league tables" />
    <meta
      property="og:description"
      content="Follow your clubs, check live scores and every table."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="360" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Vkick</title>
    <!-- Share mode: /frame.html loads the app with ?embed=1 so the fake phone
         can own the safe-area insets (an iframe has none of its own). Any normal
         load — phone, desktop, Telegram — must be untouched. -->
    <script>
      try {
        if (new URLSearchParams(window.location.search).get("embed") === "1")
          document.documentElement.dataset.embed = "1";
      } catch {}
    </script>
    <!-- Share mode switch: ?frame=1 on a WIDE, top-level, non-Telegram window
         jumps to /frame.html, which re-embeds this same app in a phone bezel.
         Every other load (phones, Telegram webview, framed pages, narrow
         windows) never redirects — the switch is opt-in by query param and
         additionally closed to exactly the contexts where the frame makes no
         sense. Runs before the bundle; any failure is swallowed so it can
         never break the boot below. -->
    <script>
      try {
        var qFrame = new URLSearchParams(window.location.search);
        if (
          qFrame.get("frame") === "1" &&
          window.innerWidth >= 700 &&
          window.top === window.self &&
          window.location.hash.indexOf("tgWebAppData") === -1
        ) {
          var frameDevUser = qFrame.get("devUser") || "";
          var devUserParam = /^\\d+$/.test(frameDevUser)
            ? "&devUser=" + encodeURIComponent(frameDevUser)
            : "";
          window.location.replace(
            "/frame.html?hash=" +
              encodeURIComponent(window.location.hash || "#/matches") +
              devUserParam
          );
        }
      } catch {}
    </script>
    <!-- BEGIN Tapsell ad loader -->
    <script type="text/javascript">
      (function () {
        const head = document.getElementsByTagName("head")[0];
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.async = true;
        script.src = "https://s1.mediaad.org/serve/vkick.onrender.com/loader.js";
        head.appendChild(script);
      })();
    </script>
    <!-- END Tapsell ad loader -->
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading">
        <img src="/vkick-mark.svg" width="64" height="64" alt="" />
        <span class="boot-ring"></span>
      </div>
    </div>
    <!-- Telegram's official SDK: initData must exist when AuthProvider first
         reads it, or the Telegram login silently degrades to a guest account
         (no bot pushes).

         It is loaded WITHOUT blocking the parser and with a hard 1.5s
         deadline. As a synchronous script it stalled boot for 32 seconds on
         any network that cannot reach telegram.org — which includes Iran,
         where this app ships — because the parser waits for a blackholed TCP
         connection to time out before it will even look at the app bundle.
         Either outcome (loaded, failed, deadline) dispatches tg-sdk-settled,
         and main.tsx mounts on that. -->
    <script>
      (function () {
        function settle() {
          if (window.__tgSdkSettled) return;
          window.__tgSdkSettled = true;
          window.dispatchEvent(new Event("tg-sdk-settled"));
        }
        var sdk = document.createElement("script");
        sdk.src = "https://telegram.org/js/telegram-web-app.js";
        sdk.async = true;
        sdk.onload = settle;
        sdk.onerror = settle;
        document.head.appendChild(sdk);
        setTimeout(settle, 1500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
