# Gates every push and PR on the four checks the repo already runs locally:
# typecheck (client + server), lint, the zero-dependency tsx test runner, and
# the production build. Docs drift and lint debt crept in precisely because
# nothing ran these automatically.
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .node-version pins the runtime (node:sqlite needs >= 22.5) and is what
      # Render reads too, so CI runs the same Node the app deploys on.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Warnings are deliberate (the repo sets `no-explicit-any` to warn), so
      # this gates on lint ERRORS only — same as running it locally.
      - name: Lint
        run: npm run lint

      # Self-contained: temp SQLite files and a localhost-only server. No
      # external network calls and no secrets required.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The built bundle ships to 360px phones on 3G — a size regression is a
      # user-facing performance regression even when every test stays green.
      - name: Bundle budget
        run: npm run budget

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The smoke suite needs a real browser, but stays OFF the package
      # manifest on purpose (installed --no-save): browsers are bulky, the
      # suite runs only here and locally.
      - name: Install Playwright browser
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      # Seeded data so the slug/fixture checks exercise real rows; SKIP_CRON=1
      # keeps the seed put while the servers run beneath the suite. The smoke
      # script itself waits for both servers to answer, so no extra wait tool.
      - name: Seed demo data
        run: npm run seed:demo
      - name: Start servers
        run: |
          SKIP_CRON=1 npx tsx server/index.ts &
          npm run dev &
      - name: Browser smoke
        run: npm run smoke
        env:
          SMOKE_CHANNEL: ""
          SMOKE_BASE_URL: http://localhost:5173
          SMOKE_API_URL: http://127.0.0.1:8787
